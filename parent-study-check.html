<!doctype html>
<html lang="ko"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="robots" content="noindex,nofollow"/><title>자녀의 공부에 개입하는 나의 행동 | 이온심리상담센터</title>
<style>
:root{--bg:#f7f5f0;--white:#fff;--ink:#27343b;--sub:#5c6b6c;--teal:#286a6d;--pale:#e3efeb;--line:#dbe1dc;--sand:#f2dfc4;--orange:#ad5e3b}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:16px/1.6 "Malgun Gothic","Noto Sans KR",sans-serif;color:var(--ink);word-break:keep-all}main{max-width:790px;margin:auto;padding:24px 16px 60px}.mast{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 0 19px;color:var(--teal);font-size:13px;font-weight:800}.mast a{color:var(--teal);text-decoration:none}h1{font-size:clamp(26px,5vw,36px);line-height:1.3;letter-spacing:-.05em;margin:4px 0 10px}h2{font-size:24px;margin:4px 0 8px}.small{font-size:13px;color:var(--sub)}p{margin:8px 0 18px}.card{padding:clamp(21px,4.5vw,34px);border:1px solid #e6e8e3;border-radius:19px;background:white;margin:15px 0;box-shadow:0 7px 24px #132f2e0b}.eyebrow{font-size:13px;letter-spacing:.065em;font-weight:800;color:var(--teal)}.legend{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:20px 0}.legend div{background:#eef3ef;border-radius:9px;padding:10px 4px;text-align:center;font-size:12px}.legend strong{display:block;font-size:21px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:25px}button,.btn{border:1px solid var(--teal);border-radius:11px;padding:12px 21px;min-height:48px;background:var(--teal);color:#fff;font:inherit;font-weight:800;cursor:pointer;text-decoration:none}button.secondary,.btn.secondary{background:white;color:var(--teal)}button:disabled{opacity:.38;cursor:not-allowed}button:focus-visible,a:focus-visible{outline:3px solid #e7a878;outline-offset:2px}.steps{display:flex;gap:7px;margin:19px 0}.steps i{height:7px;flex:1;border-radius:10px;background:#e4e9e5}.steps i.on{background:var(--teal)}.q{border-top:1px solid var(--line);padding:18px 0 20px}.q:first-of-type{border-top:0}.qno{font-size:12px;font-weight:800;color:var(--teal)}.qtitle{font-size:17px;font-weight:700;margin:5px 0 13px}.choices{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.choice{min-height:48px;background:white;color:#496261;border:1px solid #c7d7d3;font-size:14px;padding:7px 2px}.choice[aria-pressed="true"]{background:var(--teal);color:white;border-color:var(--teal)}.notice{padding:13px 15px;background:var(--pale);border-radius:10px;font-size:14px;margin:18px 0}.err{min-height:20px;color:#af4d36;font-size:14px}.result{padding:17px 0;border-bottom:1px solid var(--line)}.result:last-child{border-bottom:0}.result-top{display:flex;justify-content:space-between;gap:10px;align-items:center;font-weight:800}.track{height:11px;border-radius:20px;background:#e5ebe7;margin:9px 0;overflow:hidden}.fill{height:100%;background:var(--teal);border-radius:20px}.result.peak .fill{background:var(--orange)}.result p{font-size:14px;margin:4px 0;color:var(--sub)}.peak-note{color:var(--orange);font-size:12px;margin-left:6px}.home{border-top:1px solid var(--line);padding-top:20px;margin-top:28px}.footer{font-size:12px;text-align:center;color:var(--sub);margin:30px 0}#app{min-height:450px}@media(max-width:470px){.card{padding:19px 15px}.legend{gap:4px}.legend div{font-size:10px}.choice{font-size:12px}.actions button,.actions .btn{flex:1;text-align:center;padding:11px 8px}.qtitle{font-size:16px}}@media print{body{background:white}main{padding:0}.mast,.actions,.footer,.steps,.screen-only{display:none!important}.card{box-shadow:none;border:0;padding:0;margin:0}h1{font-size:23px}.result{break-inside:avoid}}
</style></head><body><main><div class="mast"><span>이온심리상담센터 · 학부모 특강</span><a href="https://aeoncounsel.com/">센터 홈페이지 ↗</a></div><div id="app" aria-live="polite"></div><div class="footer">이 자료는 강의용 자기점검이며 표준화된 양육검사나 진단이 아닙니다. 답변은 외부 서버로 전송되지 않습니다.</div></main>
<script>
'use strict';
const GROUPS=[["강압·압박", ["공부를 미루면 앞으로 겪게 될 불이익을 반복해서 이야기한다.", "아이가 약속을 지키지 않으면 화가 나서 말투가 강해진다.", "시험 성적이 기대에 미치지 못하면 노력 부족을 먼저 지적한다.", "자녀의 선택이 마음에 들지 않으면 끝까지 설득하거나 밀어붙인다.", "공부 문제로 실랑이를 하다가 다른 잘못까지 꺼내게 된다.", "아이가 힘들다고 말해도 우선 해야 할 일부터 하라고 요구한다."]], ["지시·대행", ["아이의 공부 시작 시각을 내가 정해주는 편이다.", "과제나 시험 일정을 아이보다 내가 더 잘 챙긴다.", "공부 순서나 방법을 내가 정해주는 일이 많다.", "아이의 계획이 미숙해 보이면 곧바로 수정해 준다.", "숙제와 학습 결과를 내가 확인해야 마음이 놓인다.", "실패할 것 같으면 아이가 직접 해보기 전에 도와주거나 대신 처리한다."]], ["허용·규칙 철회", ["공부나 휴대전화 사용에 관한 약속이 자주 흐지부지된다.", "아이가 크게 반발하면 정해둔 기준을 바꾸는 편이다.", "갈등이 생길까 봐 꼭 해야 할 말도 미루거나 포기한다.", "언제까지 무엇을 해야 하는지 부모와 아이 모두 불분명할 때가 있다.", "아이가 하겠다고 하면 구체적인 실행 약속 없이 기다리는 편이다.", "정해진 시간에 시작하지 않아도 별다른 확인 없이 넘어가는 일이 많다."]], ["구조 제공·자율성 지원", ["반드시 지켜야 할 규칙과 아이가 선택할 수 있는 일을 구분한다.", "규칙의 이유를 아이가 이해할 수 있게 설명하려고 한다.", "공부를 언제, 어떤 순서로 할지 아이의 의견을 묻는다.", "계획이 잘 지켜지지 않으면 아이와 함께 어려웠던 지점을 확인한다.", "스스로 할 수 있는 부분은 아이에게 맡기고 필요한 만큼만 돕는다.", "결과뿐 아니라 계획을 시도하거나 수정한 과정도 살펴본다."]]];
const INFO=[
['A','강압·압박','불이익·성적·실망 등을 강조하며 행동을 압박하는 반응'],
['B','지시·대행','공부 시간·순서·과제 등을 부모가 정하거나 대신 처리하는 반응'],
['C','허용·규칙 철회','정한 규칙이나 기준이 반발·갈등 속에서 유지되지 않는 반응'],
['D','구조 제공·자율성 지원','기준과 도움은 제공하고 선택·실행 기회를 함께 조정하는 반응']];
const LABELS=['전혀 그렇지 않다','가끔 그렇다','자주 그렇다','거의 항상 그렇다'];
const answer=Array(24).fill(null); let page=-1;
const app=document.getElementById('app');
function frame(s){app.innerHTML=s;scrollTo({top:0,behavior:'instant'});}
function steps(n){return `<div class="steps" aria-label="진행상황">${[0,1,2,3].map(i=>`<i class="${i<=n?'on':''}"></i>`).join('')}</div>`;}
function intro(){page=-1;frame(`<div class="card"><div class="eyebrow">자기점검 · 24문항</div><h1>자녀의 공부에 개입하는 나의 행동</h1><p>최근 한 달 동안 자녀의 공부 문제로 개입했던 실제 상황을 떠올리며 응답해 주세요.</p><div class="notice">A~D 네 묶음, 각 6문항입니다. 결과에서는 영역별 응답 빈도와 의미를 확인할 수 있습니다.</div><div class="legend">${LABELS.map((x,i)=>`<div><strong>${i}점</strong>${x}</div>`).join('')}</div><p class="small">이 활동은 자신을 돌아보는 참고 자료이며 점수로 좋은 부모·나쁜 부모를 구분하지 않습니다.</p><div class="actions"><button id="begin">시작하기 →</button></div></div>`);document.getElementById('begin').onclick=()=>questions(0);}
function questions(g){page=g;const off=g*6;frame(`<div class="card"><div class="eyebrow">${'ABCD'[g]} · ${g+1} / 4</div><h1>자기점검</h1>${steps(g)}<div class="legend">${LABELS.map((x,i)=>`<div><strong>${i}점</strong>${x}</div>`).join('')}</div>${GROUPS[g][1].map((s,i)=>`<div class="q"><div class="qno">문항 ${off+i+1} / 24</div><div class="qtitle">${s}</div><div class="choices" role="group" aria-label="문항 ${off+i+1}">${LABELS.map((_,v)=>`<button class="choice" aria-pressed="${answer[off+i]===v}" data-i="${off+i}" data-v="${v}">${v}점</button>`).join('')}</div></div>`).join('')}<div class="err" id="err"></div><div class="actions"><button class="secondary" id="prev">← 이전</button><button id="next">${g===3?'결과 확인하기':'다음 →'}</button></div></div>`);
app.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{let i=+b.dataset.i;answer[i]=+b.dataset.v;app.querySelectorAll(`[data-i="${i}"]`).forEach(e=>e.setAttribute('aria-pressed',String(e===b)));document.getElementById('err').textContent='';});document.getElementById('prev').onclick=()=>g===0?intro():questions(g-1);document.getElementById('next').onclick=()=>answer.slice(off,off+6).some(v=>v===null)?document.getElementById('err').textContent='이 묶음의 여섯 문항에 모두 답해 주세요.':g===3?results():questions(g+1);}
function results(){page=4;const scores=INFO.map((_,g)=>answer.slice(g*6,g*6+6).reduce((a,v)=>a+v,0));const max=Math.max(...scores);frame(`<div class="card"><div class="eyebrow">나의 응답 결과</div><h1>양육 행동 자기점검</h1><p class="small">각 영역 0~18점. 점수가 높을수록 최근 한 달 동안 해당 문항에 자주 응답했다는 의미입니다.</p>${INFO.map(([c,name,desc],i)=>`<div class="result ${scores[i]===max?'peak':''}"><div class="result-top"><span>${c} · ${name}${scores[i]===max?'<span class="peak-note">상대적으로 많이 응답한 영역</span>':''}</span><span>${scores[i]} / 18</span></div><div class="track"><div class="fill" style="width:${scores[i]/18*100}%"></div></div><p>${desc}</p></div>`).join('')}<div class="notice">네 영역은 서로 배타적인 부모 유형이 아니며, 이 자료는 표준화·타당화된 검사가 아닙니다.</div><div class="actions screen-only"><button class="secondary" id="back">← 응답 수정</button><button id="print">인쇄 · PDF 저장</button></div><div class="home"><p><strong>이온심리상담센터</strong></p><a class="btn" href="https://aeoncounsel.com/">센터 홈페이지로 돌아가기 ↗</a></div></div>`);document.getElementById('back').onclick=()=>questions(3);document.getElementById('print').onclick=()=>window.print();}
intro();
</script></body></html>
