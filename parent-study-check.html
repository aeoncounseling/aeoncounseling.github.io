<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>자녀의 학습지도, 나의 양육 행동 점검 | 이온심리상담센터</title>
<style>
:root{--bg:#f7f5f0;--paper:#fff;--ink:#28353b;--sub:#5b696d;--teal:#326b70;--line:#dce2de;--pale:#e8f0ed;--sand:#f4ecdf;--accent:#a45d43;--shadow:0 7px 26px rgba(31,49,49,.06)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 "Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;word-break:keep-all}main{width:min(800px,100%);margin:0 auto;padding:24px 16px 65px}h1{font-size:clamp(25px,4.5vw,35px);line-height:1.34;letter-spacing:-.04em;margin:8px 0 14px}h2{font-size:23px;letter-spacing:-.03em;margin:2px 0 10px}p{margin:9px 0 15px}.mast{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 18px;font-size:13px;font-weight:700;color:var(--teal)}a{color:var(--teal)}.mast a{text-decoration:none}.card{background:var(--paper);border:1px solid #e7e9e5;border-radius:18px;padding:clamp(20px,4.5vw,35px);box-shadow:var(--shadow);margin:16px 0}.eyebrow{font-size:12px;color:var(--teal);font-weight:800;letter-spacing:.06em}.muted{color:var(--sub)}.small{font-size:13px;color:var(--sub)}.notice{background:var(--pale);border-radius:11px;padding:15px 17px;margin:20px 0;font-size:14px}.legend{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin:18px 0}.legend>div{background:#f0f4f1;border-radius:9px;text-align:center;padding:9px 4px;font-size:12px;line-height:1.45}.legend strong{display:block;font-size:19px;margin-bottom:3px}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}button,.btn{font:inherit;border:1px solid var(--teal);border-radius:11px;padding:12px 18px;min-height:48px;color:white;background:var(--teal);font-weight:750;text-decoration:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}button.secondary,.btn.secondary{color:var(--teal);background:white}button:focus-visible,a:focus-visible{outline:3px solid #e5ac7d;outline-offset:2px}button:disabled{opacity:.42;cursor:not-allowed}.steps{display:flex;gap:7px;margin:17px 0}.steps>span{height:7px;border-radius:8px;flex:1;background:#e2e9e5}.steps>span.on{background:var(--teal)}.q{border-top:1px solid var(--line);padding:18px 0 20px}.qno{font-size:12px;color:var(--teal);font-weight:800}.qtext{font-size:17px;font-weight:650;line-height:1.55;margin:6px 0 13px}.choices{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.choice{background:white;color:#415c5e;border:1px solid #c7d6d2;padding:8px 3px;font-size:13px;line-height:1.4;min-height:47px;font-weight:650}.choice[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:white}.err{min-height:23px;color:#a5442e;font-size:14px;margin-top:8px}.result{border-top:1px solid var(--line);padding:18px 0}.resulttop{display:flex;justify-content:space-between;gap:10px;align-items:baseline;font-size:16px;font-weight:750}.resulttop strong{font-variant-numeric:tabular-nums;white-space:nowrap}.track{background:#e6ece8;height:11px;border-radius:20px;overflow:hidden;margin:10px 0}.fill{background:var(--teal);height:100%;border-radius:20px}.result p{margin:6px 0;color:var(--sub);font-size:14px}.summary{background:var(--sand);border-radius:12px;padding:16px 18px;margin:20px 0}.summary h2{font-size:19px;margin:1px 0 7px}.home{border-top:1px solid var(--line);padding-top:21px;margin-top:26px}.footer{font-size:12px;color:var(--sub);text-align:center;margin:26px 0}#app{min-height:400px}@media(max-width:520px){.card{padding:20px 15px}.legend{gap:4px}.legend>div{font-size:10px;padding:7px 2px}.legend strong{font-size:17px}.qtext{font-size:16px}.choice{font-size:11px;padding:7px 2px}.actions>button,.actions>.btn{flex:1;text-align:center;padding:11px 8px}.mast{font-size:12px;flex-wrap:wrap}}@media print{body{background:white}main{padding:0}.mast,.footer,.actions,.steps,.noprint{display:none!important}.card{box-shadow:none;border:0;margin:0;padding:0}.result,.summary{break-inside:avoid}h1{font-size:24px}}
</style>
</head>
<body><main><div class="mast"><span>이온심리상담센터 · 학부모 특강</span><a href="https://aeoncounsel.com/">센터 홈페이지 ↗</a></div><div id="app" aria-live="polite"></div><div class="footer">강의용 자기점검 자료입니다. 표준화된 양육검사 또는 진단도구가 아닙니다.<br>응답은 현재 이용 중인 기기에서만 계산되며 외부 서버로 전송되지 않습니다.</div></main>
<script>
'use strict';
// Domains are internal scoring metadata only. Do not display them before completion.
const AREAS={
 A:{name:'허용적·비일관적 양육',description:'아이와 친구처럼 지내려 하거나 갈등을 피하려다, 정해 둔 규칙과 부모의 기준이 아이의 요구나 반발에 밀려 쉽게 바뀌는 행동 경향',interpret:'"안 된다"고 했다가 아이가 조르면 허락하거나, 정해 둔 약속을 끝까지 지키지 못하는 일이 반복되고 있는지 살펴볼 수 있습니다.'},
 B:{name:'부모 주도적·통제적 양육',description:'공부 계획과 방법은 물론 세세한 부분까지 부모가 정하고 확인하며, 따르지 않으면 꾸중이나 불이익으로 행동을 이끄는 경향',interpret:'아이를 돕기 위한 관리가 어느새 지적과 통제, 불이익으로 이어지고 있지는 않은지, 아이가 스스로 계획하고 시도해 볼 여지가 남아 있는지 살펴볼 수 있습니다.'},
 C:{name:'구조 제공·자율성 지원',description:'꼭 필요한 기준과 한계는 부모가 어른으로서 분명히 지키면서, 그 안에서 아이가 스스로 결정하고 실행할 부분을 남겨 두는 행동 경향',interpret:'규칙의 이유와 범위를 분명히 하고, 아이가 선택한 방법을 시도하거나 수정할 기회를 지원하는 행동이 얼마나 자주 나타나는지 살펴볼 수 있습니다.'}
};
const ITEMS=[
 ['B','아이가 세운 공부 계획이 현실성이 없어 보이면, 내가 먼저 고쳐 주는 경우가 많다.'],
 ['A','숙제나 잠자는 시간 약속을 지키지 않았는데도, 아이가 사정하면 "이번만이야" 하고 넘어가 주는 일이 잦다.'],
 ['C','잠자는 시간이나 등교 시간처럼 꼭 지켜야 할 기준은 분명히 정해 두고, 공부 순서 같은 것은 아이가 정하게 한다.'],
 ['A','아이와 다툼이 길어질 것 같으면, 정해 두었던 휴대전화 사용 규칙을 그 자리에서 바꿀 때가 있다.'],
 ['C','약속한 계획이 잘 지켜지지 않았을 때, 먼저 아이에게 어려웠던 점을 묻고 어떤 도움이 필요한지 함께 정한다.'],
 ['B','공부를 시작하는 시간과 순서는 내가 정해 주어야 마음이 놓인다.'],
 ['C','규칙을 정할 때 아이의 의견을 듣고, 그 규칙이 왜 필요한지도 함께 이야기한다.'],
 ['B','아이가 숙제하는 동안 옆에서 지켜보며, 내 방식과 다르면 바로 고치게 하는 편이다.'],
 ['A','아이와 친구처럼 지내고 싶어서, 부모로서 꼭 해야 할 제지나 잔소리를 하지 않고 넘어가는 편이다.'],
 ['B','아이가 공부를 하지 않으면, 혼을 내거나 불이익을 주겠다고 말해서라도 하게 만든다.'],
 ['A','자고 일어나는 시간이 계속 늦어져도 아이가 싫어하면 그 이야기를 꺼내지 않고 미루는 편이다.'],
 ['C','아이가 고른 공부 방법이 내 생각과 달라도, 정해 둔 기준 안에서라면 직접 해 보게 한다.'],
 ['A','규칙을 어겼을 때 어떻게 할지 미리 정해 두어도, 실제로는 그대로 하지 못할 때가 많다.'],
 ['C','계획이 자주 지켜지지 않으면 아이와 함께 다시 조정하되, 수면처럼 중요한 생활 기준은 그대로 지킨다.'],
 ['B','시험이나 수행평가 일정은 아이에게 맡기지 않고, 내가 직접 챙기고 관리한다.'],
 ['C','아이가 도움을 요청하면 구체적으로 도와주되, 혼자 할 수 있는 부분은 스스로 하게 한다.'],
 ['B','문제집 고르기, 필기 방법, 공부하는 자리처럼 세세한 것까지 내가 정하고 그대로 하는지 확인한다.'],
 ['A','아이가 강하게 반발하면, 확인해야 할 과제나 일정이 남아 있어도 더 묻지 않고 대화를 끝내는 편이다.'],
 ['B','계획이 지켜지지 않으면, 아이가 이유를 말하기도 전에 내가 새 계획을 세워 주는 편이다.'],
 ['A','"안 된다"고 말했다가도, 아이가 계속 조르거나 떼를 쓰면 결국 허락해 주는 일이 많다.'],
 ['C','아이가 기준을 지키지 못했을 때는 무슨 일이 있었는지 함께 확인하고, 다음 약속을 구체적으로 정한다.'],
 ['C','공부 계획이 어긋나면 내가 대신 정리해 주기보다, 아이가 어떻게 고칠지 스스로 말할 때까지 기다린다.'],
 ['A','다투지 않고 하루를 마무리하려고, 숙제나 휴대전화 사용 시간 확인을 다음 날로 미루는 일이 잦다.'],
 ['B','아이가 내 말을 따르지 않으면 휴대전화, 외출, 용돈 같은 것을 바로 제한한다.']
];
const LABELS=['전혀 그렇지 않다','드물게 그렇다','자주 그렇다','거의 항상 그렇다'];
const response=Array(ITEMS.length).fill(null);let position=-1;const app=document.getElementById('app');
function render(html){app.innerHTML=html;window.scrollTo({top:0,behavior:'instant'});}
function progress(i){return `<div class="steps" aria-label="진행 상황">${Array.from({length:4},(_,n)=>`<span class="${n<=i?'on':''}"></span>`).join('')}</div>`;}
function scale(){return `<div class="legend">${LABELS.map((l,i)=>`<div><strong>${i}점</strong>${l}</div>`).join('')}</div>`;}
function intro(){position=-1;render(`<section class="card"><div class="eyebrow">학습지도 행동 자기점검 · 24문항</div><h1>자녀의 공부에 개입하는 나의 행동</h1><p>자녀에게 공부·시간관리·생활 규칙을 이야기했던 <strong>최근 한 달의 실제 상황</strong>을 떠올리며 응답해 주세요. 평소에 어떻게 해야 한다고 생각하는지가 아니라, 실제로 얼마나 자주 했는지를 선택합니다.</p><div class="notice">문항은 4개 화면에 6개씩 제시됩니다. 모든 문항에 응답하면 세 가지 행동 경향의 점수와 간단한 설명을 볼 수 있습니다.</div>${scale()}<p class="small">정답은 없습니다. 이 자료는 양육유형을 진단하거나 부모를 평가하는 검사가 아닙니다.</p><div class="actions"><button id="start">시작하기 →</button></div></section>`);document.getElementById('start').onclick=()=>questions(0);}
function questions(group){position=group;const off=group*6;render(`<section class="card"><div class="eyebrow">자기점검 · ${group+1} / 4</div><h1>최근 한 달의 나의 행동</h1>${progress(group)}${scale()}${ITEMS.slice(off,off+6).map(([area,q],j)=>{const idx=off+j;return `<div class="q"><div class="qno">문항 ${idx+1} / 24</div><div class="qtext">${q}</div><div class="choices" role="group" aria-label="문항 ${idx+1}">${LABELS.map((label,v)=>`<button class="choice" type="button" aria-label="${label}" aria-pressed="${response[idx]===v}" data-idx="${idx}" data-score="${v}">${v}점</button>`).join('')}</div></div>`;}).join('')}<div class="err" id="error" role="alert"></div><div class="actions"><button class="secondary" id="prev">← 이전</button><button id="next">${group===3?'결과 확인하기':'다음 →'}</button></div></section>`);
app.querySelectorAll('[data-idx]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.idx);response[i]=Number(b.dataset.score);app.querySelectorAll(`[data-idx="${i}"]`).forEach(c=>c.setAttribute('aria-pressed',String(c===b)));document.getElementById('error').textContent='';});
document.getElementById('prev').onclick=()=>group===0?intro():questions(group-1);
document.getElementById('next').onclick=()=>{if(response.slice(off,off+6).some(v=>v===null)){document.getElementById('error').textContent='현재 화면의 여섯 문항에 모두 답해 주세요.';return;}group===3?results():questions(group+1);};}
function results(){position=4;const scores={A:0,B:0,C:0};ITEMS.forEach(([a],i)=>scores[a]+=response[i]);const max=Math.max(...Object.values(scores));const top=Object.keys(scores).filter(k=>scores[k]===max);
let headline=top.length===1?`상대적으로 더 자주 나타난 경향: ${AREAS[top[0]].name}`:'같은 점수로 나타난 경향: '+top.map(k=>AREAS[k].name).join(' · ');
let explain=top.length===1?AREAS[top[0]].interpret:'세 경향은 서로 배타적인 유형이 아닙니다. 상황에 따라 서로 다른 방식으로 개입할 수 있으므로 각 영역의 설명을 함께 확인해 보세요.';
render(`<section class="card"><div class="eyebrow">나의 응답 결과</div><h1>학습지도에서 나타나는 세 가지 양육 행동</h1><p class="small">각 영역은 8문항, 0~24점입니다. 점수는 최근 한 달 동안 해당 행동을 보고한 빈도의 합계입니다. 표준화된 평균이나 진단 기준은 아닙니다.</p>${Object.keys(AREAS).map(k=>`<div class="result"><div class="resulttop"><span>${k} · ${AREAS[k].name}</span><strong>${scores[k]} / 24</strong></div><div class="track"><div class="fill" style="width:${scores[k]/24*100}%"></div></div><p>${AREAS[k].description}</p></div>`).join('')}<div class="summary"><h2>${headline}</h2><p>${explain}</p></div><div class="notice">이 결과는 세 가지 행동의 상대적인 응답 빈도를 보여줍니다. 점수 하나로 부모의 고정된 양육유형이나 자녀의 상태를 판별하지 않습니다. 필요에 따라 여러 경향이 함께 나타날 수 있습니다.</div><div class="actions noprint"><button class="secondary" id="back">← 응답 수정</button><button id="print">인쇄 · PDF 저장</button><button class="secondary" id="restart">처음부터 다시</button></div><div class="home"><p><strong>이온심리상담센터</strong></p><a class="btn" href="https://aeoncounsel.com/">센터 홈페이지로 돌아가기 ↗</a></div></section>`);
document.getElementById('back').onclick=()=>questions(3);document.getElementById('print').onclick=()=>window.print();document.getElementById('restart').onclick=()=>{if(window.confirm('현재 응답을 지우고 처음부터 다시 시작할까요?')){response.fill(null);intro();}};}
intro();
</script></body></html>
