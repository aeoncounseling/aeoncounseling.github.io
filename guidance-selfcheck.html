<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>나의 관계 성향 알아보기</title>
<style>
:root{
  --ink:#222a33; --sub:#5a6672; --line:#dde3e8; --bg:#f6f8fa; --card:#fff;
  --brand:#2c6e7f; --brand-d:#1f5260; --brand-t:#e9f3f6; --warn:#b4531f;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  line-height:1.65;font-size:16px;word-break:keep-all;overflow-wrap:break-word}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 72px}
h1{font-size:22px;line-height:1.35;margin:8px 0 6px}
h2{font-size:18px;margin:0 0 10px}
h3{font-size:15px;margin:18px 0 6px;color:var(--brand-d)}
p{margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 18px;margin:14px 0}
.muted{color:var(--sub);font-size:14px}
.small{font-size:13px}
ul{margin:4px 0 8px;padding-left:20px}
li{margin:3px 0}
button{font-family:inherit;font-size:16px;cursor:pointer}
.btn{display:inline-block;border:0;border-radius:10px;background:var(--brand);color:#fff;padding:13px 22px;font-weight:600}
.btn:active{background:var(--brand-d)}
.btn.ghost{background:#fff;color:var(--brand-d);border:1px solid var(--brand)}
.btn[disabled]{background:#b9c4ca;border-color:#b9c4ca;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}

/* 안내 */
.notice{background:var(--brand-t);border-radius:12px;padding:12px 14px;font-size:14px;color:#244a55}
.notice li{margin:2px 0}

/* 진행 */
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--line)}
.bar{height:8px;background:#e1e7ec;border-radius:6px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--brand);width:0;transition:width .25s}
.scale{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin-top:6px}

/* 문항 */
.q{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 14px 12px;margin:10px 0}
.q.miss{border-color:var(--warn);box-shadow:0 0 0 2px #f3d9c9}
.q .t{margin:0 0 10px;font-size:16px}
.q .n{color:var(--sub);font-size:12px;margin-right:6px}
.opts{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.opts label{position:relative}
.opts input{position:absolute;opacity:0;pointer-events:none}
.opts .b{display:flex;flex-direction:column;align-items:center;justify-content:center;height:54px;border:1px solid #c9d2d9;border-radius:10px;
  background:#fff;color:#3b4650;user-select:none;line-height:1.15}
.opts .b b{font-size:17px}
.opts .b small{font-size:10.5px;color:#6b7782}
.opts input:checked+.b{background:var(--brand);border-color:var(--brand);color:#fff}
.opts input:checked+.b small{color:#e3f0f3}
.opts input:focus-visible+.b{outline:3px solid #9cc7d2}
.ends{display:flex;justify-content:space-between;font-size:11px;color:var(--sub);margin-top:5px}

/* 결과 */
.type-card{border-radius:16px;padding:20px 18px;border:2px solid var(--tc,#888);background:var(--tt,#fff)}
.type-card .kicker{font-size:13px;color:var(--sub);margin:0}
.type-card h1{margin:2px 0 2px;color:var(--tc,#222)}
.type-card .tag{font-size:16px;font-weight:600;margin:0 0 10px}
.chip{display:inline-block;border-radius:20px;padding:2px 10px;font-size:12px;background:#fff;border:1px solid var(--line);margin-right:4px}
.dom{margin:12px 0}
.dom .hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14px}
.dom .hd b{font-size:15px}
.dom .meter{height:12px;background:#e8edf1;border-radius:7px;overflow:hidden;margin:5px 0 4px}
.dom .meter i{display:block;height:100%;background:var(--brand);border-radius:7px}
.dom.ref .meter i{background:#8aa6ae}
.dom .lv{font-size:12px;border-radius:12px;padding:1px 8px;background:#eef2f5;color:#42505a;white-space:nowrap}
.dom .lv.high{background:#dcebe5;color:#1e5a42}
.dom .lv.low{background:#f1ebe2;color:#6f5326}
.dom p{margin:2px 0 0;font-size:14px;color:#37424b}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:8px 0}
summary{cursor:pointer;font-weight:600}
textarea{width:100%;min-height:78px;border:1px solid #c9d2d9;border-radius:10px;padding:10px;font:inherit;font-size:15px;resize:vertical}
.warn{background:#fdf1e8;border:1px solid #f0cdb3;border-radius:12px;padding:12px 14px;font-size:14px;color:#6c3a14}

/* 강사용 */
.admin table{width:100%;border-collapse:collapse;font-size:13px}
.admin td,.admin th{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left;vertical-align:top}
.admin .r{color:var(--warn);font-weight:700}
.admin .new{color:#2f8a62}

@media print{
  body{background:#fff;font-size:12.5px}
  .wrap{padding:0;max-width:none}
  .noprint,.top{display:none!important}
  .card,details,.type-card{break-inside:avoid;border-color:#ccc}
  details{display:block}
  details>summary{display:none}
  textarea{border:1px solid #bbb;min-height:60px}
}

</style>
</head>

  function pageComplete() {
    var s = state.page * PER_PAGE, e = Math.min(TOTAL, s + PER_PAGE), first = null;
    for (var i = s; i < e; i++) {
      var ok = !!state.answers[ITEMS[i].n];
      var el = document.getElementById(ITEMS[i].id);
      if (!ok) { if (el) el.classList.add('miss'); if (!first) first = el; }
    }
    if (first) { first.scrollIntoView({ behavior: 'smooth', block: 'center' }); return false; }
    return true;
  }

  function onAnswer(n, v, card) {
    state.answers[n] = v; save();
    card.classList.add('done'); card.classList.remove('miss');
    var bar = app.querySelector('.bar>i'); if (bar) bar.style.width = Math.round(answeredCount() / TOTAL * 100) + '%';
    var cnt = app.querySelector('.top .muted'); if (cnt) cnt.textContent = '응답 ' + answeredCount() + ' / ' + TOTAL;
    setTimeout(function () {
      var nxt = app.querySelector('.q:not(.done)');
      var target = nxt || document.getElementById('next');
      if (target && target.scrollIntoView) target.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 140);
  }

  /* ---------- 결과 화면 ---------- */
  function listHtml(arr) { return '<ul>' + arr.map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</ul>'; }

  function renderResult() {
    var r = E.score(ITEMS, state.answers);
    var T = C.types, P = T[r.primary], S = T[r.secondary];
    var h = '';
    if (state.preview) h += '<div class="warn noprint">미리보기 화면입니다. (강사용 확인 모드) <button class="btn ghost" id="toAdmin" style="padding:6px 12px;margin-left:8px">강사용 화면으로</button></div>';
    if (r.maxShare >= 0.8 && !state.preview) {
      h += '<div class="warn noprint">응답이 거의 같은 번호에 몰려 있어 결과가 뚜렷하게 나오지 않았을 수 있습니다. 괜찮다면 한 번 더 천천히 해 보세요.</div>';
    }
    h += '<div class="type-card" style="--tc:' + P.color + ';--tt:' + P.tint + '">' +
      '<p class="kicker">나의 1순위 유형</p><h1>' + P.name + '</h1><p class="tag">' + P.tagline + '</p><p>' + P.summary + '</p>' +
      '<p class="small muted" style="margin:0">2순위 유형: <b>' + S.name + '</b>' + (r.close ? ' (1순위와 점수가 비슷합니다)' : '') + ' · 에너지 스타일: <b>' + C.energy[r.energy].title + '</b></p></div>';

    h += '<div class="card"><h2>나의 2순위 유형</h2>' +
      '<p style="margin-bottom:6px"><b style="color:' + S.color + '">' + S.name + '</b> · ' + S.tagline + '</p><p>' +
      (r.close ? '1순위와 2순위의 점수 차이가 크지 않아서, ' + P.name + '과 ' + S.name + ' 설명을 모두 읽어 보면 좋습니다. ' : '') +
      '2순위 유형인 ' + S.name + '은 ' + S.add + ' 1순위 유형인 ' + P.name + '의 방식을 보완해 줍니다.</p></div>' +
      '<div class="card"><h2>나의 에너지 스타일 · ' + C.energy[r.energy].title + '</h2><p>' + C.energy[r.energy].text + '</p></div>';

    h += '<div class="card"><h2>영역별로 보면</h2><p class="muted small">막대는 1~5점 평균을 0~100으로 바꾼 것입니다. 오른쪽 표시는 일반적인 수준과 비교한 판정이 아니라 나의 경향을 읽기 위한 참고용입니다.</p>';
    E.DOMAINS.forEach(function (d) {
      var dm = C.domains[d], lv = r.level[d];
      h += '<div class="dom' + (d === 'G' ? ' ref' : '') + '"><div class="hd"><b>' + dm.name + '</b><span class="lv ' + lv + '">' + C.labels[lv] + ' · ' + r.index[d] + '</span></div>' +
        '<div class="meter"><i style="width:' + r.index[d] + '%"></i></div><p>' + dm[lv] + '</p></div>';
    });
    h += '<p class="muted small" style="margin-top:12px">침착성은 유형 판정에는 쓰지 않고, 압박 상황에서의 나를 살펴보기 위한 참고 영역입니다. 오늘의 컨디션(피로, 긴장)에 따라 달라질 수 있습니다.</p></div>';

    h += '<div class="card"><h2>' + P.name + ' 자세히 보기</h2>' +
      '<h3>교실과 상담에서의 강점</h3>' + listHtml(P.strengths) +
      '<h3>놓치기 쉬운 부분</h3>' + listHtml(P.watch) +
      '<h3>힘든 학생을 만났을 때</h3><p>' + P.hardStudent + '</p>' +
      '<h3>학급 규칙을 세울 때</h3><p>' + P.classRules + '</p>' +
      '<h3>상담 실습에서</h3><p>' + P.counseling + '</p>' +
      '<h3>소그룹 활동에서</h3><p>' + P.smallGroup + '</p>' +
      '<h3>스스로에게 던져 볼 질문</h3>' + listHtml(P.questions) + '</div>';

    h += '<div class="card"><h2>내 생각 적어 두기</h2>' +
      '<p class="muted small">결과를 읽고 느낀 점을 적어 두면, 수업에서 이야기 나눌 때 도움이 됩니다.</p>' +
      '<p style="margin-bottom:4px"><b>이 결과에서 ‘맞다’고 느낀 점</b></p><textarea id="memoGood"></textarea>' +
      '<p style="margin:12px 0 4px"><b>의외이거나 ‘나와 다르다’고 느낀 점</b></p><textarea id="memoSurprise"></textarea></div>';

    h += '<div class="card noprint"><h2>다른 유형도 살펴보기</h2><p class="muted small">모둠을 구성하거나 동료와 이야기할 때 참고하세요.</p>';
    T.forEach(function (t) {
      h += '<details><summary style="color:' + t.color + '">' + t.name + ' · ' + t.tagline + '</summary><p style="margin-top:8px">' + t.summary + '</p>' +
        '<h3>강점</h3>' + listHtml(t.strengths) + '<h3>놓치기 쉬운 부분</h3>' + listHtml(t.watch) + '</details>';
    });
    h += '</div>';

    h += '<div class="card"><h2>이 결과를 읽는 방법</h2><ul>' +
      '<li>이 결과는 진단이나 성격 판정이 아니라, 오늘 응답에 나타난 나의 경향을 돌아보는 자료입니다.</li>' +
      '<li>어떤 유형도 더 좋거나 나쁘지 않습니다. 교실에는 서로 다른 교사의 모습이 모두 필요합니다.</li>' +
      '<li>‘나와 다르다’고 느껴지는 부분이 있다면 그것도 중요한 정보입니다. 상황과 컨디션, 그리고 ‘되고 싶은 나’와 ‘지금의 나’의 차이를 함께 떠올려 보세요.</li>' +
      '<li>유형 하나로 사람을 설명할 수는 없습니다. 영역별 막대와 아래 질문들을 함께 사용해 주세요.</li></ul></div>';

    h += '<div class="row noprint" style="margin-top:6px"><button class="btn" id="print">결과 저장 (인쇄 · PDF)</button>' +
      '<button class="btn ghost" id="toIntro">첫 안내 화면으로</button>' +
      '<button class="btn ghost" id="restart">처음부터 다시 하기</button></div>' +
      '<p class="muted small noprint" style="margin-top:8px">화면을 캡처해도 되고, ‘결과 저장’을 누른 뒤 PDF로 저장해도 됩니다.</p>';
    app.innerHTML = h;
    var g = document.getElementById('memoGood'), s2 = document.getElementById('memoSurprise');
    g.value = state.memo.good || ''; s2.value = state.memo.surprise || '';
    g.addEventListener('input', function () { state.memo.good = g.value; save(); });
    s2.addEventListener('input', function () { state.memo.surprise = s2.value; save(); });
  }

  /* ---------- 강사용 화면 (?admin=1) ---------- */
  function answersFromMeans(m) {
    var a = {};
    ITEMS.forEach(function (it) { var v = m[it.d]; a[it.n] = it.r ? 6 - v : v; });
    return a;
  }
  var PREVIEWS = [
    { label: '공감·수용형 미리보기', m: { A: 3, B: 5, C: 3, D: 3, E: 3, F: 4, G: 3 } },
    { label: '분석·설계형 미리보기', m: { A: 3, B: 3, C: 5, D: 3, E: 3, F: 3, G: 3 } },
    { label: '주도·결단형 미리보기', m: { A: 4, B: 3, C: 3, D: 5, E: 3, F: 3, G: 4 } },
    { label: '조율·연결형 미리보기', m: { A: 3, B: 3, C: 3, D: 3, E: 5, F: 5, G: 2 } }
  ];
  function renderAdmin() {
    var by = {}, srcSet = {}, mod = 0, nw = 0, rev = 0;
    GS_ITEMS_RAW.forEach(function (x, i) {
      (by[x.d] = by[x.d] || []).push(x);
      if (x.src) { srcSet[x.src] = 1; if (x.mod) mod++; } else nw++;
      if (x.r) rev++;
    });
    var kept = Object.keys(srcSet).length - mod;
    var h = '<div class="admin"><div class="card"><h1>강사용 확인 화면</h1>' +
      '<p>총 ' + TOTAL + '문항 · 역채점 ' + rev + '개 · 원문항 132개 중 그대로 유지 ' + kept + ' / 표현 수정 ' + mod + ' / 삭제 ' + (132 - kept - mod) + ' · 신규 ' + nw + '</p>' +
      '<div class="row">';
    PREVIEWS.forEach(function (p, i) { h += '<button class="btn ghost" data-prev="' + i + '">' + p.label + '</button>'; });
    h += '<button class="btn ghost" id="randPrev">무작위 응답 미리보기</button><button class="btn ghost" id="toStudent">학생용 첫 안내 화면 보기</button></div></div>';
    h += '<div class="card"><h2>점수 기준값(가정값)</h2><table><tr><th>영역</th><th>평균</th><th>표준편차</th></tr>';
    E.DOMAINS.forEach(function (d) { h += '<tr><td>' + d + ' ' + C.domains[d].name + '</td><td>' + E.NORMS[d][0] + '</td><td>' + E.NORMS[d][1] + '</td></tr>'; });
    h += '</table><p class="muted small">유형 점수: 공감·수용=B, 분석·설계=C, 주도·결단=D, 조율·연결=(E+F)/2 x ' + E.T4_SCALE + ' (각각 z점수). 가장 높은 것이 1순위 유형, 두 번째가 2순위 유형. A는 에너지 스타일, G는 참고 영역.</p></div>';
    ['A', 'B', 'C', 'D', 'E', 'F', 'G'].forEach(function (d) {
      h += '<div class="card"><h2>' + d + '. ' + C.domains[d].name + ' (' + by[d].length + ')</h2><table><tr><th>역</th><th>원번호</th><th>문항</th></tr>';
      by[d].forEach(function (x) {
        h += '<tr><td class="r">' + (x.r ? 'R' : '') + '</td><td>' + (x.src ? x.src + (x.mod ? ' (수정)' : '') : '<span class="new">신규</span>') + '</td><td>' + esc(x.t) + '</td></tr>';
      });
      h += '</table></div>';
    });
    h += '</div>';
    app.innerHTML = h;
  }

  /* ---------- 진행 ---------- */
  function render() {
    if (state.screen === 'intro') renderIntro();
    else if (state.screen === 'quiz') renderQuiz();
    else if (state.screen === 'result') renderResult();
    else if (state.screen === 'admin') renderAdmin();
  }

  var restartArmed = false, restartTimer = null;
  function doRestart() {
    clearSaved(); state.answers = {}; state.page = 0; state.memo = { good: '', surprise: '' }; state.preview = false;
    restartArmed = false; go('intro');
  }
  function restartAll(btn) {
    if (!restartArmed) {
      restartArmed = true;
      btn.textContent = '응답이 모두 지워집니다. 한 번 더 누르면 처음으로 돌아갑니다';
      clearTimeout(restartTimer);
      restartTimer = setTimeout(function () { restartArmed = false; if (btn && btn.isConnected) btn.textContent = '처음부터 다시 하기'; }, 5000);
      return;
    }
    clearTimeout(restartTimer); doRestart();
  }

  app.addEventListener('click', function (ev) {
    var t = ev.target; while (t && t !== app && !t.id && !(t.dataset && t.dataset.prev !== undefined)) t = t.parentNode;
    if (!t || t === app) return;
    if (t.dataset && t.dataset.prev !== undefined) {
      state.preview = true; state.answers = answersFromMeans(PREVIEWS[+t.dataset.prev].m); state.screen = 'result'; render(); top(); return;
    }
    switch (t.id) {
      case 'start': state.page = 0; go('quiz'); break;
      case 'resume':
        var firstMissing = 0;
        for (var i = 0; i < TOTAL; i++) { if (!state.answers[ITEMS[i].n]) { firstMissing = i; break; } }
        state.page = Math.floor(firstMissing / PER_PAGE); go('quiz'); break;
      case 'seeResult': go('result'); break;
      case 'restart': restartAll(t); break;
      case 'prev': if (state.page > 0) { state.page--; save(); render(); top(); } else { go('intro'); } break;
      case 'next':
        if (!pageComplete()) break;
        if (state.page < PAGES - 1) { state.page++; save(); render(); top(); }
        else go('result');
        break;
      case 'toIntro': state.preview = false; state.screen = 'intro'; render(); top(); break;
      case 'print': window.print(); break;
      case 'randPrev':
        state.preview = true; state.answers = {};
        ITEMS.forEach(function (it) { state.answers[it.n] = 1 + Math.floor(Math.random() * 5); });
        state.screen = 'result'; render(); top(); break;
      case 'toAdmin': state.preview = false; state.answers = {}; state.screen = 'admin'; render(); top(); break;
      case 'toStudent': state.preview = false; state.answers = {}; state.page = 0; state.screen = 'intro'; render(); top(); break;
    }
  });

  app.addEventListener('change', function (ev) {
    var t = ev.target;
    if (t && t.type === 'radio') {
      var card = t.closest('.q');
      onAnswer(+card.getAttribute('data-n'), +t.value, card);
    }
  });

  /* 시작 */
  if (isAdmin) { state.screen = 'admin'; }
  else {
    load();
    if (state.screen === 'result' && answeredCount() < TOTAL) state.screen = 'intro';
    if (state.screen === 'quiz' && answeredCount() === 0) state.screen = 'intro';
  }
  render();
})();

</script>
</body>
</html>
